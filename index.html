<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Discord Username Checker</title>
<style>
  :root{--bg:#f5f6fa;--card:#fff;--ink:#1e1f2b;--muted:#6b6f85;--line:#dfe1ec;--accent:#5865f2;--ok:#1a9d55;--bad:#d23b3b}
  @media (prefers-color-scheme: dark){:root{--bg:#16171f;--card:#1f2029;--ink:#eceef8;--muted:#9296ad;--line:#30323f;--ok:#3ddc84;--bad:#ff6b6b}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:20px 14px 40px}
  main{max-width:640px;margin:0 auto}
  h1{font-size:1.5rem;margin:0 0 4px}
  p.sub{margin:0 0 18px;color:var(--muted)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
  label{display:block;font-weight:600;margin:0 0 6px}
  input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
  .row:first-child{margin-top:0}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  button{font:inherit;font-weight:600;padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button:disabled{opacity:.45;cursor:not-allowed}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:0 0 8px}
  .bar>div{height:100%;width:0;background:var(--accent);transition:width .2s}
  .stats{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:.9rem}
  .stats b{color:var(--ink)}
  #status{margin-top:8px;color:var(--muted);font-size:.9rem;min-height:1.4em}
  #found{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;max-height:240px;overflow:auto}
  .chip{padding:3px 9px;border-radius:999px;border:1px solid var(--ok);color:var(--ok);font-family:ui-monospace,Menlo,monospace;font-size:.9rem}
</style>
</head>
<body>
<main>
  <h1>Discord username checker</h1>
  <p class="sub">Checks unique usernames (not display names) and sends available ones to your webhook.</p>

  <div class="card">
    <div class="row">
      <div><label for="len">Length</label>
        <select id="len"><option value="both">2 and 3 characters</option><option value="2">2 characters</option><option value="3">3 characters</option></select></div>
      <div><label for="delay">Delay per check (ms)</label>
        <input id="delay" type="number" min="200" step="100" value="1500"></div>
    </div>
    <div class="row">
      <div><label for="chars">Characters</label>
        <input id="chars" type="text" value="abcdefghijklmnopqrstuvwxyz0123456789_." spellcheck="false"></div>
      <div><label for="start">Resume from index</label>
        <input id="start" type="number" min="0" value="0"></div>
    </div>
    <div class="btns">
      <button id="go" class="primary">Start</button>
      <button id="pause" disabled>Pause</button>
      <button id="stop" disabled>Stop</button>
      <button id="copy">Copy available</button>
    </div>
  </div>

  <div class="card">
    <div class="bar"><div id="fill"></div></div>
    <div class="stats">
      <span>Checked <b id="sChecked">0</b> / <b id="sTotal">0</b></span>
      <span>Available <b id="sFree" style="color:var(--ok)">0</b></span>
      <span>Taken <b id="sTaken">0</b></span>
      <span>Errors <b id="sErr" style="color:var(--bad)">0</b></span>
      <span>Index <b id="sIdx">0</b></span>
      <span>Pace <b id="sPace">0</b> ms</span>
    </div>
    <div id="status">Idle.</div>
    <div id="found" aria-live="polite"></div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
let state = { running:false, paused:false, stop:false };
let found = [], pending = [], counts = { checked:0, taken:0, err:0 }, hookWarned = false;
let hit429 = false, curDelay = 1500, okStreak = 0;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const setStatus = t => $("status").textContent = t;

function* generate(chars, lengths){
  for (const L of lengths){
    const idx = new Array(L).fill(0);
    while (true){
      const name = idx.map(i => chars[i]).join("");
      if (!name.includes("..")) yield name;
      let p = L - 1;
      while (p >= 0 && ++idx[p] === chars.length){ idx[p] = 0; p--; }
      if (p < 0) break;
    }
  }
}
const total = (chars, lengths) => lengths.reduce((t, L) => t + Math.pow(chars.length, L), 0);

function render(index, totalCount){
  $("sChecked").textContent = counts.checked;
  $("sTotal").textContent = totalCount;
  $("sFree").textContent = found.length;
  $("sTaken").textContent = counts.taken;
  $("sErr").textContent = counts.err;
  $("sIdx").textContent = index;
  $("sPace").textContent = Math.round(curDelay);
  $("fill").style.width = (totalCount ? index / totalCount * 100 : 0) + "%";
}

async function notify(content){
  for (let a = 0; a < 4; a++){
    try{
      const r = await fetch("/api/notify", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ content }) });
      if (r.status === 429){ const j = await r.json().catch(() => ({})); await sleep((j.retry_after || 2) * 1000 + 250); continue; }
      if (!r.ok && !hookWarned){ hookWarned = true; const j = await r.json().catch(() => ({})); setStatus("Webhook problem: " + (j.error || r.status)); }
      return;
    }catch(e){ await sleep(1500); }
  }
}

async function flush(force){
  if (!pending.length || (!force && pending.length < 25)) return;
  const batch = pending.splice(0);
  await notify("Available usernames:\n" + batch.map(n => "`" + n + "`").join(", "));
}

async function check(name){
  while (true){
    const r = await fetch("/api/check?u=" + encodeURIComponent(name));
    const j = await r.json().catch(() => ({}));
    if (r.status === 429){
      hit429 = true;
      const wait = (j.retry_after || 5) * 1000 + 500 + Math.random() * 500;
      setStatus("Rate limited. Waiting " + Math.ceil(wait / 1000) + "s…");
      await sleep(wait); continue;
    }
    if (!r.ok) throw new Error((j.error || "HTTP " + r.status) + (j.detail ? " – " + j.detail : ""));
    return j.taken === false;
  }
}

async function run(){
  const chars = [...new Set($("chars").value.toLowerCase().split(""))];
  const mode = $("len").value;
  const lengths = mode === "both" ? [2, 3] : [Number(mode)];
  const delay = Math.max(200, Number($("delay").value) || 1500);
  const startAt = Math.max(0, Number($("start").value) || 0);
  curDelay = delay; okStreak = 0; hit429 = false;
  const totalCount = total(chars, lengths);

  counts = { checked:0, taken:0, err:0 }; found = []; pending = []; hookWarned = false;
  $("found").innerHTML = "";
  state = { running:true, paused:false, stop:false };
  $("go").disabled = true; $("pause").disabled = false; $("stop").disabled = false;
  await notify("Started checking " + lengths.join(" & ") + "-character usernames (from index " + startAt + ").");

  let i = 0, errs = 0, failed = false;
  for (const name of generate(chars, lengths)){
    if (state.stop) break;
    if (i < startAt){ i++; continue; }
    while (state.paused && !state.stop){ setStatus("Paused at index " + i + "."); await sleep(300); }
    if (state.stop) break;
    setStatus("Checking “" + name + "”…");
    try{
      const free = await check(name);
      counts.checked++; errs = 0;
      if (hit429){ curDelay = Math.min(curDelay * 1.5, 15000); okStreak = 0; hit429 = false; }
      else if (++okStreak >= 20){ curDelay = Math.max(delay, curDelay * 0.9); okStreak = 0; }
      if (free){
        found.push(name); pending.push(name);
        const c = document.createElement("span"); c.className = "chip"; c.textContent = name;
        $("found").appendChild(c);
        await flush(false);
      } else counts.taken++;
    }catch(e){
      counts.err++;
      if (++errs >= 5){ setStatus("Stopped after 5 errors in a row: " + e.message); failed = true; break; }
      await sleep(2000); continue;
    }
    i++;
    render(i, totalCount);
    await sleep(curDelay);
  }

  render(i, totalCount);
  await flush(true);
  await notify("Finished at index " + i + ". Checked " + counts.checked + ", available " + found.length + ".");
  if (!failed) setStatus(state.stop ? "Stopped at index " + i + "." : "Done.");
  $("start").value = i;
  state.running = false;
  $("go").disabled = false; $("pause").disabled = true; $("stop").disabled = true; $("pause").textContent = "Pause";
}

$("go").onclick = run;
$("pause").onclick = () => { state.paused = !state.paused; $("pause").textContent = state.paused ? "Resume" : "Pause"; };
$("stop").onclick = () => { state.stop = true; state.paused = false; };
$("copy").onclick = async () => {
  try{ await navigator.clipboard.writeText(found.join("\n")); setStatus("Copied " + found.length + " names."); }
  catch(e){ setStatus("Couldn’t copy. Select the names manually."); }
};
</script>
</body>
</html>
